name: Release

# Push a tag like v0.1.0 to build, attach the wheel to a GitHub release and publish to PyPI.
# PyPI publishing uses Trusted Publishing: register this repo and workflow on PyPI first.

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # create the GitHub release
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      # Drop-in zip for standalone yt-dlp users (conventional release asset for plugins)
      - run: zip -r "dist/${GITHUB_REPOSITORY#*/}.zip" yt_dlp_plugins -x '*__pycache__*'
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - run: uv publish
