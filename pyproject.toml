[project]
name = "yt-dlp-example-plugin"
version = "0.1.0"
description = "A yt-dlp plugin for example.com"
readme = "README.md"
authors = [{ name = "gnoays" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["yt-dlp", "yt-dlp-plugin"]
# yt-dlp is intentionally not a dependency: users of the standalone exe
# install plugins without pip, and pip users already have yt-dlp
dependencies = []
classifiers = [
    "Environment :: Plugins",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/gnoays/yt-dlp-example-plugin"
Issues = "https://github.com/gnoays/yt-dlp-example-plugin/issues"

[dependency-groups]
dev = ["yt-dlp", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_plugins"]

[tool.pytest.ini_options]
addopts = ["-m", "not network"]
markers = ["network: tests that access the real site (run with: uv run pytest -m network)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# yt-dlp extractors declare _TESTS etc. as mutable class attributes
ignore = ["RUF012"]

[tool.ruff.format]
quote-style = "single"
